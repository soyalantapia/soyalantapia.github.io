<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Alan Tapia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap">
<style>
:root{color-scheme:light dark; --fondo:#FBF9FF; --tinta:#20112F; --violeta:#6D28D9}
@media (prefers-color-scheme:dark){:root{--fondo:#130920; --tinta:#F0EAFA; --violeta:#B394F5}}
html,body{height:100%}
body{margin:0; display:grid; place-items:center; background:var(--fondo); color:var(--tinta);
  font-family:"Poppins","Segoe UI",system-ui,sans-serif; text-align:center; padding:24px}
h1{font-size:clamp(34px,7vw,58px); font-weight:600; letter-spacing:-.04em; margin:0}
p{font-weight:300; color:var(--violeta); margin:14px 0 0; letter-spacing:.16em;
  text-transform:uppercase; font-size:11.5px}
</style>
</head>
<body>
<main>
  <h1>Alan Tapia</h1>
  <p>Deenex &middot; Xnod</p>
</main>
</body>
</html>
